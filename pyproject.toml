[project]
name = "verisuri-api"
version = "0.1.0"
description = "VeriSuri FastAPI runtime for Vercel"
# Vercel must not select Python 3.14: the pinned ML/API dependencies below
# have compatible wheels for CPython 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "httpx==0.28.1",
  "scikit-learn==1.6.0",
  "joblib==1.4.2",
  "numpy==2.2.1",
]
